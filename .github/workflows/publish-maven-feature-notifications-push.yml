# Publishes io.github.devatrii:feature-notifications-push to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-notifications-push

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish-maven-reusable.yml
    secrets: inherit
    with:
      gradle_module: ":features:notifications:push"
      artifact_id: "feature-notifications-push"
