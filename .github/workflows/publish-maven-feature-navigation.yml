# Publishes io.github.devatrii:feature-navigation to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-navigation

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish-maven-reusable.yml
    secrets: inherit
    with:
      gradle_module: ":features:navigation"
      artifact_id: "feature-navigation"
