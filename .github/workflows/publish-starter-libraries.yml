# Publishes all KMP libraries (starter + features) to Maven Central (Sonatype Central Portal).
# Per-module workflows: .github/workflows/publish-maven-<artifact-id>.yml (workflow_dispatch each).
#
# CI runs 3 parallel macOS jobs (starter / features-base / features-ui) to cut wall-clock time.
# Local: ./gradlew publishKmpLibrariesToMavenCentral
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME   — Central Portal user token username
#   MAVEN_CENTRAL_PASSWORD   — Central Portal user token password
#   SIGNING_KEY              — ASCII-armored GPG secret key (full block including BEGIN/END lines)
#   SIGNING_PASSWORD         — Passphrase for that key (empty string if none)
#
# Gradle reads these via ORG_GRADLE_PROJECT_* (see KmpLibraryPublishPlugin and
# https://vanniktech.github.io/gradle-maven-publish-plugin/central/).
#
# Version is defined in gradle/libs.versions.toml (lib-version-major/minor/patch).
# Namespace io.github.devatrii must be verified on https://central.sonatype.com/
#
# macOS is required: Kotlin/Native (iOS) and :starter:native:bindings (spm-kmp / Swift).

name: Publish libraries to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: starter
            gradle_task: publishKmpLibrariesStarterShardToMavenCentral
          - shard: features-base
            gradle_task: publishKmpLibrariesFeaturesBaseShardToMavenCentral
          - shard: features-ui
            gradle_task: publishKmpLibrariesFeaturesUiShardToMavenCentral
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: "17"
          cache-read-only: false

      - name: Publish shard (${{ matrix.shard }})
        run: |
          ./gradlew ${{ matrix.gradle_task }} \
            --parallel \
            --build-cache \
            -x test \
            -x allTests \
            -x lint \
            -x lintAnalyze \
            -x lintReport \
            --stacktrace
