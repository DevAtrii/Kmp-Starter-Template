# Publishes io.github.devatrii:feature-core-presentation to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-core-presentation

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish-maven-reusable.yml
    secrets: inherit
    with:
      gradle_module: ":features:core_app:presentation"
      artifact_id: "feature-core-presentation"
