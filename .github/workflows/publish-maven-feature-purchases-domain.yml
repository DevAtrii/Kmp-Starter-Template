# Publishes io.github.devatrii:feature-purchases-domain to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-purchases-domain

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish-maven-reusable.yml
    secrets: inherit
    with:
      gradle_module: ":features:purchases:domain"
      artifact_id: "feature-purchases-domain"
