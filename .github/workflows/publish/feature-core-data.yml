# Publishes io.github.devatrii:feature-core-data to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-core-data

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish/reusable-maven-central.yml
    secrets: inherit
    with:
      gradle_module: ":features:core_app:data"
      artifact_id: "feature-core-data"
