# Publishes io.github.devatrii:starter-utils to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish starter-utils

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish/reusable-maven-central.yml
    secrets: inherit
    with:
      gradle_module: ":starter:utils"
      artifact_id: "starter-utils"
