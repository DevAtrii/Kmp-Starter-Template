# Publishes io.github.devatrii:feature-locale to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-locale

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish/reusable-maven-central.yml
    secrets: inherit
    with:
      gradle_module: ":features:locale"
      artifact_id: "feature-locale"
