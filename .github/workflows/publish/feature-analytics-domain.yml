# Publishes io.github.devatrii:feature-analytics-domain to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-analytics-domain

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish/reusable-maven-central.yml
    secrets: inherit
    with:
      gradle_module: ":features:analytics:domain"
      artifact_id: "feature-analytics-domain"
