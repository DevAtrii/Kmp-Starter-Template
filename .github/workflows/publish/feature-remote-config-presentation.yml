# Publishes io.github.devatrii:feature-remote-config-presentation to Maven Central.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD

name: Publish feature-remote-config-presentation

on:
  workflow_dispatch:

jobs:
  publish:
    uses: ./.github/workflows/publish/reusable-maven-central.yml
    secrets: inherit
    with:
      gradle_module: ":features:remote_config:presentation"
      artifact_id: "feature-remote-config-presentation"
