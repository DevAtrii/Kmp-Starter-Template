# Reusable job: publish one KMP library module to Maven Central.
# Called from per-module workflows in this directory.
#
# Secrets (repository): MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
#   SIGNING_KEY, SIGNING_PASSWORD — see publish-starter-libraries.yml

name: Publish Maven (reusable)

on:
  workflow_call:
    inputs:
      gradle_module:
        description: "Gradle project path (e.g. :starter:core)"
        required: true
        type: string
      artifact_id:
        description: "Maven artifactId (e.g. starter-core)"
        required: true
        type: string

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Publish ${{ inputs.artifact_id }} to Maven Central
        run: |
          ./gradlew "${{ inputs.gradle_module }}:publishAllPublicationsToMavenCentralRepository" \
            --no-configuration-cache \
            --stacktrace
