name: Skill Script Tests

on:
  workflow_dispatch:
  push:
    paths:
      - .agents/skills/kmp-starter/search-docs.py
      - .agents/skills/kmp-starter/search-code.py
      - .agents/skills/kmp-starter/scan-project.py
      - .agents/skills/kmp-starter/tests/**
  pull_request:
    paths:
      - .agents/skills/kmp-starter/search-docs.py
      - .agents/skills/kmp-starter/search-code.py
      - .agents/skills/kmp-starter/scan-project.py
      - .agents/skills/kmp-starter/tests/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Run skill script tests
        id: tests
        run: python3 .agents/skills/kmp-starter/tests/run_tests.py --json

      - name: Show report
        if: always()
        run: cat .agents/skills/kmp-starter/tests/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            .agents/skills/kmp-starter/tests/report.md
            .agents/skills/kmp-starter/tests/report.json
          if-no-files-found: ignore
